spring:
  application:
    name: controle-financeiro
  mvc:
    locale: pt_BR
    locale-resolver: fixed
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: pt_BR
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_control}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: INFO