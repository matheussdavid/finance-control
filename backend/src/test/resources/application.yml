spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: pt_BR
  datasource:
    url: jdbc:h2:mem:finance_control_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=MONTH,YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-validation
    expiration-ms: 60000
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 0